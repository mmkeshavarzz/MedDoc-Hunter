name: Medical Doc Hunter (Ninja Edition 🥷)

on:
  schedule:
    - cron: '0 */12 * * *' # هر ۱۲ ساعت یکبار بیدار میشه
  workflow_dispatch: # دکمه دستی برای اجرای فوری

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 🐍
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies 💊
        # کتابخونه‌های جدید برای اسکریپینگ
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
        
      - name: Run Stealth Scraper 🚀
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DEST_CHANNEL: ${{ secrets.DEST_CHANNEL }}
        run: python scraper.py
